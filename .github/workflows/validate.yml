name: Validate ASTROMIND showcase
on:
  push:
  pull_request:
jobs:
  project-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository assets and data
        run: python scripts/validate_repo.py
